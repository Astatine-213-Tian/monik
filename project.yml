name: Monik
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
targets:
  Monik:
    type: application
    platform: macOS
    sources:
      - path: Monik
    info:
      path: Monik/Info.plist
      properties:
        CFBundleDisplayName: Monik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocationUsageDescription: Your location is used only to work out when the sun rises and sets.
        NSLocationWhenInUseUsageDescription: Your location is used only to work out when the sun rises and sets.
    entitlements:
      path: Monik/Monik.entitlements
      properties:
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: Monik
        PRODUCT_MODULE_NAME: Monik
        PRODUCT_BUNDLE_IDENTIFIER: com.monik.app
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MonikTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MonikTests
      - path: Monik/Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.monik.tests
        CODE_SIGN_IDENTITY: "-"
schemes:
  Monik:
    build:
      targets:
        Monik: all
        MonikTests: [test]
    run:
      config: Debug
    test:
      targets:
        - MonikTests
